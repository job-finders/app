[tool:pytest]
# Pytest configuration for Job Actions tests

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --showlocals
    --durations=10
    --color=yes

# Coverage options
# These are applied when running with --cov
cov-report =
    term-missing
    html:tests/coverage_html
    xml:tests/coverage.xml

# Minimum coverage threshold
cov-fail-under = 90

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    database: Tests that require database
    controller: Controller tests
    model: Model tests
    service: Service tests
    analytics: Analytics tests

# Async test support
asyncio_mode = auto

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:sqlalchemy.*

# Test timeout (in seconds)
timeout = 300

# Parallel execution
# Uncomment to run tests in parallel
# addopts = -n auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test environment
env =
    TESTING = 1
    FLASK_ENV = testing
    DATABASE_URL = sqlite:///:memory:
    REDIS_URL = redis://localhost:6379/1