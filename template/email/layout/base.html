<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "Billing Notification" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 2rem 1rem;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
            font-size: 1.25rem;
            font-weight: 500;
        }
        .highlight {
            font-size: 1.1rem;
            font-weight: 600;
            color: #212529;
        }
        .footer {
            font-size: 0.875rem;
            color: #6c757d;
            margin-top: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="card shadow-sm">
            <div class="card-header text-center">
                {{ header or "Billing Notification" }}
            </div>
            <div class="card-body">
                {% block content %}{% endblock %}
            </div>
        </div>
        <div class="footer">
            &copy; Custom Logic Pty LTD — All rights reserved.
        </div>
    </div>
</body>
</html>
