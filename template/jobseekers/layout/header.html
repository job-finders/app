<div class="header">
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col-lg-12 d-flex justify-content-between">
                <!-- Left Side (Hamburger Menu + Logo) -->
                <div class="d-flex align-items-center">
                    <div class="hamburger sidebar-toggle mr-3">
                        <span class="line"></span>
                        <span class="line"></span>
                        <span class="line"></span>
                    </div>
                    <a href="{{ url_for('home.get_home') }}" class="font-weight-bold text-info h5 mb-0">JobFinders</a>
                </div>

                <!-- Right Side (Navigation Buttons) -->
                <div class="d-flex align-items-center">
                    <a href="{{ url_for('jobs.assisted_search') }}" class="btn btn-sm btn-outline-success font-weight-bold text-info mx-1">Find Jobs</a>
                    <a href="{{ url_for('jobseekers.upload_cv') }}" class="btn btn-sm btn-outline-success font-weight-bold text-info mx-1">Submit CV</a>
                    <a href="{{ url_for('jobseekers.applications') }}" class="btn btn-sm btn-outline-success font-weight-bold text-info mx-1">My Applications</a>
                    <a href="https://blog.jobfinders.site" class="btn btn-sm btn-outline-success font-weight-bold text-info mx-1">Blog</a>
                    <a href="{{ url_for('home.contact') }}" class="btn btn-sm btn-outline-success font-weight-bold text-info mx-1">Contact</a>
                    <a href="{{ url_for('home.about') }}" class="btn btn-sm btn-outline-success font-weight-bold text-info mx-1">About</a>

                    <!-- Auth Buttons -->
                    {% if current_user and not not current_user.is_authenticated %}
                        <a href="{{ url_for('jobseekers.profile') }}" class="btn btn-sm btn-outline-primary font-weight-bold mx-1">My Profile</a>
                        <a href="{{ url_for('auth.logout') }}" class="btn btn-sm btn-danger font-weight-bold text-white mx-1">Logout</a>
                    {% else %}
                        <a href="{{ url_for('auth.login') }}" class="btn btn-sm btn-outline-primary font-weight-bold mx-1">Login</a>
                        <a href="{{ url_for('auth.subscribe') }}" class="btn btn-sm btn-primary font-weight-bold text-white mx-1">Create Account</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
