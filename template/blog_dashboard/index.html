<!-- /templates/blog_dashboard/index.html -->

{% extends "layout.html" %}
{% block title %}Blog Insights{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto p-6 bg-white rounded shadow">
    <h1 class="text-2xl font-bold mb-4">🧠 Blog Intelligence Dashboard</h1>

    <form method="POST" action="{{ url_for('blog_feedback.submit_feedback') }}">
        <div class="mb-4">
            <label for="article_id" class="block text-gray-700">Article ID</label>
            <input type="text" name="article_id" class="w-full border px-3 py-2 rounded" required>
        </div>
        <div class="mb-4">
            <label for="feedback_score" class="block text-gray-700">Feedback Score (0–10)</label>
            <input type="number" name="feedback_score" class="w-full border px-3 py-2 rounded" min="0" max="10" required>
        </div>
        <div class="mb-4">
            <label for="comments" class="block text-gray-700">Comments (optional)</label>
            <textarea name="comments" class="w-full border px-3 py-2 rounded"></textarea>
        </div>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Submit Feedback</button>
    </form>

    <hr class="my-8">

    <h2 class="text-xl font-semibold mb-2">🎨 Suggested Blog Images</h2>
    <div class="grid grid-cols-3 gap-4">
        {% for image in suggested_images %}
            <div>
                <img src="{{ image.url }}" alt="Suggested Image" class="rounded shadow w-full">
                <p class="text-sm mt-1">{{ image.caption }}</p>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
