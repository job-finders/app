<div class="modal fade" id="newJobModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('jobs_workflow.save_job_draft') }}">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-primary"><i class="ti-plus me-2"></i>Create Job Post</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- JOB INFO -->
                    <h6 class="text-muted fw-semibold mb-3">Job Information</h6>
                    <div class="mb-3">
                        <label class="form-label">Job Title *</label>
                        <input type="text" name="title" class="form-control" required minlength="5" maxlength="255">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description *</label>
                        <textarea name="description" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Position Type *</label>
                            <select name="position_type" class="form-control" required>
                                <option value="FULL_TIME">Full Time</option>
                                <option value="PART_TIME">Part Time</option>
                                <option value="CONTRACT">Contract</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Remote Policy *</label>
                            <select name="remote_policy" class="form-control" required>
                                <option value="ONSITE">Onsite</option>
                                <option value="HYBRID">Hybrid</option>
                                <option value="REMOTE">Remote</option>
                            </select>
                        </div>
                    </div>

                    <!-- SALARY -->
                    <h6 class="text-muted fw-semibold mb-3">Salary & Compensation</h6>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Min Salary</label>
                            <input type="number" name="salary_min" class="form-control" min="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Max Salary</label>
                            <input type="number" name="salary_max" class="form-control" min="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Currency *</label>
                            <input type="text" name="salary_currency" class="form-control" value="ZAR" maxlength="3"
                                   required>
                        </div>
                    </div>
                    <!-- LOCATION -->
                    <h6 class="text-muted fw-semibold mb-3">Location</h6>
                    <div class="row mb-3">
                        <div class="col-md-4"><label class="form-label">City *</label><input type="text" name="city"
                                                                                             class="form-control"
                                                                                             required></div>
                        <div class="col-md-4"><label class="form-label">Province *</label><input type="text"
                                                                                                 name="province"
                                                                                                 class="form-control"
                                                                                                 required></div>
                        <div class="col-md-4"><label class="form-label">Country *</label><input type="text"
                                                                                                name="country"
                                                                                                class="form-control"
                                                                                                required></div>
                    </div>
                    <!-- TIMELINE -->
                    <h6 class="text-muted fw-semibold mb-3">Timeline</h6>
                    <div class="row mb-3">
                        <div class="col-md-6"><label class="form-label">Application Deadline</label><input
                                type="date" name="application_deadline" class="form-control" min="{{ today }}">
                        </div>
                        <div class="col-md-6"><label class="form-label">Expiration Date *</label><input type="date"
                                                                                                        name="expires_at"
                                                                                                        class="form-control"
                                                                                                        required
                                                                                                        min="{{ today }}">
                        </div>
                    </div>

                    <!-- STATUS -->
                    <h6 class="text-muted fw-semibold mb-3">Status</h6>
                    <select name="status" class="form-control" required>
                        <option value="draft">Draft</option>
                        <option value="active">Active</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save & Next</button>
                </div>
            </form>
        </div>
    </div>
</div>
