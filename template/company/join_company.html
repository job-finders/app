{% extends "auth/layout.html" %}

{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-0 text-center py-4">
                        <h2 class="h4 mb-0 fw-bold">Join {{ company_name }}</h2>
                        <p class="mb-0">Complete your account setup</p>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="bg-light-primary rounded-circle p-3 d-inline-block mb-3">
                                <i class="bi bi-person-plus fs-2 text-primary"></i>
                            </div>
                            <p>You've been invited to join as <strong>{{ full_name }}</strong></p>
                            <p class="text-muted">Create a password to complete your account setup</p>
                        </div>

                        <form method="POST" action="{{ url_for('company.join_company', token=token) }}">
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>

                            <div class="mb-4">
                                <label for="confirm_password" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password"
                                       name="confirm_password" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                                Create Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
