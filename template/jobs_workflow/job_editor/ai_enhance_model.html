

    <!-- AI Enhance Modal -->
    <div class="modal modal-lg fade" id="aiPromptModal" tabindex="-1" aria-labelledby="aiPromptModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="aiPromptModalLabel">✨ AI Enhance</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <!-- Prompt -->
                    <label for="userPrompt" class="form-label fw-bold">💬 Tell me how to improve your content</label>
                    <textarea id="userPrompt" class="form-control" rows="6" maxlength="500"
                              placeholder="e.g. Make the tone more casual, add diversity statement, focus on technical details..."></textarea>
                    <div class="character-count">
                        <span id="charCount">0</span>/500 characters
                    </div>

                    <!-- Suggestions card -->
                    <div class="suggestions-card" id="aiSuggestionsContainer" style="display:none">
                        <div class="suggestions-header">
                            💡 Quick Suggestions
                        </div>
                        <div class="suggestions-body">
                            <div id="aiSuggestionsList" class="suggestions-container">
                                <!-- badges injected here -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="doEnhanceBtn">🚀 Enhance</button>
                </div>
            </div>
        </div>
    </div>
