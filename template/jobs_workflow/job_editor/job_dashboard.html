<!-- Job Actions Card -->
<div class="card shadow-sm mb-4">
    <div class="card-header bg-white">
        <h6 class="mb-0 fw-semibold">
            <i class="ti-dashboard me-2"></i>Job Actions
        </h6>
    </div>

    <div id="dashboardPanel" class="card-body">
        <!-- Status badge -->
        <div class="mb-3 mt-2">
      <span class="badge
        {% if job.status == 'draft' %}bg-secondary
        {% elif job.status == 'pending' %}bg-warning text-dark
        {% elif job.status == 'active' %}bg-success
        {% elif job.status == 'closed' %}bg-danger
        {% else %}bg-light text-dark{% endif %} fs-6">
        Job Status : {{ job.status.title() }}
      </span>
        </div>

        <!-- Action buttons -->
        <div class="btn-group-vertical w-100 gap-2">
            {% if job.status == 'draft' %}
                <button type="button" class="btn btn-outline-success"
                        onclick="updateJobStatus('{{ job.job_id }}', 'pending')">
                    <i class="ti-upload me-1"></i>Submit for Review
                </button>
            {% elif job.status == 'pending' %}
                <small class="text-muted">Awaiting admin approval</small>
            {% elif job.status == 'active' %}
                <button type="button" class="btn btn-outline-warning"
                        onclick="updateJobStatus('{{ job.job_id }}', 'closed')">
                    <i class="ti-close me-1"></i>Close Job
                </button>
                {% if not job.is_featured %}
                    <button type="button" class="btn btn-outline-primary"
                            onclick="toggleFeatured('{{ job.job_id }}', true)">
                        <i class="ti-star me-1"></i>Feature Job
                    </button>
                {% else %}
                    <button type="button" class="btn btn-outline-secondary"
                            onclick="toggleFeatured('{{ job.job_id }}', false)">
                        <i class="ti-star me-1"></i>Remove Feature
                    </button>
                {% endif %}
            {% elif job.status == 'closed' %}
                <button type="button" class="btn btn-outline-success"
                        onclick="updateJobStatus('{{ job.job_id }}', 'active')">
                    <i class="ti-reload me-1"></i>Re-open Job
                </button>
            {% endif %}
        </div>
    </div>
</div>
