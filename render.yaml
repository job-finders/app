services:
  - type: web
    name: jobfinders
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT

    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobfinders-db
          property: connectionString

    # Runs before every deploy — handles migrations automatically
    preDeployCommand: flask db upgrade

databases:
  - name: jobfinders-db
    databaseName: jobfinders
    plan: free
