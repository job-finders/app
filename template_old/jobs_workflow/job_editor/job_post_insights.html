{# agents/job_post_insights_card.html #}
{% macro icon(name) %}
  <i class="bi bi-{{ name }}"></i>
{% endmacro %}

<div class="card shadow-sm mb-4" id="jobPostInsightsCard">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">{{ icon('lightning-charge') }} Job Post Intelligence</h5>
    <button id="refreshInsightsBtn"
            class="btn btn-outline-primary btn-sm"
            type="button"
            title="Refresh analysis">
      {{ icon('arrow-clockwise') }}
    </button>
  </div>

  <div class="card-body">
    <div id="insightsLoadingSpinner" class="text-center py-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 mb-0 text-muted">Analyzing job post…</p>
    </div>

    <div id="insightsContent" style="display: none;">
      <!-- Clarity Score -->
      <div class="mb-3">
        <label class="form-label fw-bold">Clarity Score</label>
        <div class="progress" style="height: 1.5rem;">
          <div id="clarityProgressBar"
               class="progress-bar"
               role="progressbar"
               style="width: 0%"
               aria-valuenow="0"
               aria-valuemin="0"
               aria-valuemax="100">
            0 %
          </div>
        </div>
      </div>

      <!-- Salary Benchmark -->
      <div class="mb-3">
        <label class="form-label fw-bold">Salary Benchmark</label>
        <p id="salaryBenchmarkBadge"
           class="badge fs-6 bg-info text-dark">
          —
        </p>
      </div>
      <!-- Missing Information -->
      <div class="mb-3">
        <label class="form-label fw-bold">{{ icon('exclamation-triangle-fill') }} Missing Information</label>
        <ul id="missingInfoList" class="list-group list-group-flush">
          <li class="list-group-item text-muted">None</li>
        </ul>
      </div>
      <!-- Suggestions -->
      <div>
        <label class="form-label fw-bold">{{ icon('lightbulb-fill') }} Suggestions</label>
        <ul id="suggestionsList" class="list-group list-group-flush">
          <li class="list-group-item text-muted">None</li>
        </ul>
      </div>
    </div>
    <div id="insightsErrorAlert" class="alert alert-danger mt-3" style="display: none;">
      Unable to load insights. Please try again later.
    </div>
  </div>
</div>
