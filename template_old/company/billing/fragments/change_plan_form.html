{# HTMX / Turbo fragment – renders inside #changePlanModal #}
<form hx-post="{{ url_for('billing.change_plan') }}"
      hx-target="#changePlanModal .modal-content"
      hx-swap="innerHTML"
      class="modal-content rounded-4"
      hx-encoding="multipart/form-data">

    <div class="modal-header border-bottom-0">
        <h5 class="fw-semibold mb-0">Change Plan</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body">
        <input type="hidden" name="company_id" value="{{ company.company_id }}">
        <div class="mb-3">
            <label class="form-label fw-medium">Select Plan</label>
            <select class="form-select rounded-3" name="plan_id" required>
                {% for plan in list_billing_plans %}
                    <option value="{{ plan.plan_id }}"
                            {% if plan.plan_id == current_plan.plan_id %}selected{% endif %}>
                        {{ plan.name }} – {{ plan.price }} ZAR / 30 days
                    </option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="modal-footer border-top-0">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel
        </button>
        <button type="submit" class="btn btn-primary rounded-pill px-4">Change Plan</button>
    </div>
</form>
