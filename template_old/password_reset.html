{% extends "layouts/auth.html" %}

{% block content %}
<div class="login-content">

    <div class="login-logo">
        <a href="{{ url_for('home.get_home') }}">
            <span class="font-weight-bold">Job</span><span class="text-white-50 font-weight-bold">Finders</span>
        </a>
    </div>

    {% include "layouts/flash.html" %}

    <div class="login-form">
        <h4 class="font-weight-bold text-primary">Reset Your Password</h4>
        <p class="text-muted font-weight-bold">Enter your email to receive reset instructions</p>

        <form action="{{ url_for('auth.password_reset') }}" method="POST">
            <div class="form-group">
                <label for="email" class="font-weight-bold">Email address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <button type="submit" class="btn btn-primary btn-flat w-100 mt-2">Send Reset Link</button>

            <div class="register-link mt-4 text-center font-weight-bold">
                <p><a href="{{ url_for('home.get_home') }}">← Back to Home</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
