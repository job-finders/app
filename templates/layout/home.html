<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}JobFinders.site{% endblock %}</title>

    {% block meta %}
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% endblock %}

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for("static", filename="styles/styles.css") }}" rel="stylesheet"/>

    {% block style %}
        <!-- Insert Styles Here -->
    {% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark hero-gradient shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="/">
                <i class="fas fa-briefcase me-2"></i>JobFinders.site
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    {% block nav %}{% endblock %}
                </ul>
                <ul class="navbar-nav mb-2 mb-lg-0">
                  {% block nav_right %}{% endblock %}
                </ul>
            </div>
        </div>
    </nav>


    {% block content %}
        <!-- Insert Page Content Here -->
    {% endblock %}

    {% block footer %}
        {% include "layout/footer.html" %}
    {% endblock %}


    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            themeToggle.addEventListener('change', () => {
                document.documentElement.setAttribute('data-bs-theme', themeToggle.checked ? 'dark' : 'light');
                localStorage.setItem('theme', themeToggle.checked ? 'dark' : 'light');
            });
            if (localStorage.getItem('theme') === 'dark') {
                themeToggle.checked = true;
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            }
        }
    </script>
</body>
</html>
